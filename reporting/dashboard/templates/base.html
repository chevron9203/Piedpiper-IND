<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piedpiper — NSE Momentum — {% block title %}Dashboard{% endblock %}</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f5f0;
      --surface:     #ffffff;
      --border:      #d8d8d0;
      --text:        #1a1a18;
      --text-muted:  #6b6b60;
      --accent:      #2a7ae2;
      --accent-dark: #1a5bbf;
      --green:       #27ae60;
      --red:         #e74c3c;
      --orange:      #e67e22;
      --nav-bg:      #1a1a18;
      --nav-text:    #d0d0c8;
      --nav-active:  #ffffff;
      --font-mono:   "JetBrains Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
      --font-sans:   -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    html { font-size: 15px; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Navigation ───────────────────────────────────────────────────── */
    nav {
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .nav-brand {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--nav-active);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.85rem 1.25rem 0.85rem 0;
      margin-right: 0.5rem;
      border-right: 1px solid #3a3a38;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 0;
    }

    .nav-links a {
      display: block;
      color: var(--nav-text);
      text-decoration: none;
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--nav-active);
      background: rgba(255,255,255,0.05);
    }

    .nav-links a.active {
      color: var(--nav-active);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* ── Page container ───────────────────────────────────────────────── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    /* ── Typography ───────────────────────────────────────────────────── */
    h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 0.25rem; }
    h2 { font-size: 1.15rem; font-weight: 600; margin: 1.5rem 0 0.75rem; color: var(--text); }
    h3 { font-size: 0.95rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    /* ── Cards / surfaces ─────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Metrics row ──────────────────────────────────────────────────── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
    }

    /* ── Tables ───────────────────────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.87rem;
      background: var(--surface);
    }

    thead th {
      background: #f0f0eb;
      padding: 0.6rem 0.9rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #f0f0eb; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafaf6; }

    td {
      padding: 0.55rem 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    td.text-col {
      font-family: var(--font-sans);
    }

    /* ── Badges / pills ───────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.15em 0.55em;
      border-radius: 3px;
      font-size: 0.76rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .badge-green  { background: #d4f5e2; color: #1a6b40; }
    .badge-red    { background: #fde8e8; color: #9b1c1c; }
    .badge-orange { background: #fef3cd; color: #7a4800; }
    .badge-grey   { background: #ebebeb; color: #555; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* ── Forms ────────────────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea,
    select {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 70px; }

    .btn {
      display: inline-block;
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.82rem; }

    /* ── Alert / info boxes ───────────────────────────────────────────── */
    .alert {
      padding: 1rem 1.25rem;
      border-radius: 6px;
      border: 1px solid;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .alert-info    { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .alert-warning { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .alert-empty   {
      background: #fafaf6;
      border: 2px dashed var(--border);
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-family: var(--font-mono);
    }

    /* ── Pagination ───────────────────────────────────────────────────── */
    .pagination {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }

    .pagination a, .pagination span {
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
    }

    .pagination a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pagination span.current { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
    .pagination span.ellipsis { border: none; background: none; }

    /* ── Comparison cards ─────────────────────────────────────────────── */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .compare-grid { grid-template-columns: 1fr; }
      .nav-links a { padding: 0.85rem 0.65rem; font-size: 0.82rem; }
    }

    /* ── Sortable table headers ───────────────────────────────────────── */
    thead th a {
      color: inherit;
      text-decoration: none;
    }
    thead th a:hover { text-decoration: underline; }

    /* ── Misc ─────────────────────────────────────────────────────────── */
    .muted { color: var(--text-muted); font-size: 0.85rem; }
    .mono  { font-family: var(--font-mono); }
    hr     { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin: 1.5rem 0 0.75rem;
    }
    .section-header h2 { margin: 0; }
    .section-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-brand">&#x25c9; Piedpiper</div>
  <ul class="nav-links">
    <li><a href="{{ url_for('overview') }}"
           class="{{ 'active' if active_tab == 'overview' else '' }}">Overview</a></li>
    <li><a href="{{ url_for('momentum') }}"
           class="{{ 'active' if active_tab == 'momentum' else '' }}">Momentum Portfolio</a></li>
    <li><a href="{{ url_for('guard') }}"
           class="{{ 'active' if active_tab == 'guard' else '' }}">Daily Guard</a></li>
    <li><a href="{{ url_for('intraday_view') }}"
           class="{{ 'active' if active_tab == 'intraday' else '' }}">Intraday ORB</a></li>
    <li><a href="{{ url_for('research') }}"
           class="{{ 'active' if active_tab == 'research' else '' }}">Research</a></li>
    <li><a href="{{ url_for('settings_view') }}"
           class="{{ 'active' if active_tab == 'settings' else '' }}">Settings</a></li>
  </ul>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
